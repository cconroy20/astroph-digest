name: Daily digest

on:
  schedule:
    # GitHub runs schedules best-effort and may drop them under load, so the job is triggered four times;
    # the first run that fires builds the digest, later ones find it done and only republish.
    # 06:07 / 07:37 / 09:17 / 11:47 UTC = 2:07 / 3:37 / 5:17 / 7:47 am EDT (an hour earlier in EST).
    - cron: "7 6 * * 1-5"
    - cron: "37 7 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "47 11 * * 1-5"
  workflow_dispatch:           # "Run workflow" button for a manual run
  push:                        # republish when the pages are edited by hand
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cache the INDUS text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nasa-smd-ibm-st-v2

      - name: Install
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Build today's digest
        run: python code/daily.py --site docs

      - name: Save the digest and the day's archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/daily
          git diff --cached --quiet || { git commit -m "Digest $(date -u +%F)" && git pull --rebase && git push; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

name: Daily digest

on:
  schedule:
    # The on-time trigger is EXTERNAL: cron-job.org POSTs a workflow_dispatch at 12:10 am America/New_York, Mon-Fri
    # (GitHub's own schedules ran ~5 h late every day in Oct 2026); the page's Update button sends the same request.
    # The schedules below stay as a backup.
    # GitHub runs schedules best-effort and may drop them under load, so the job is triggered four times;
    # the first run that fires builds the digest, later ones find it done and only republish.
    # 04:07 / 05:37 / 07:17 / 09:47 UTC = 12:07 / 1:37 / 3:17 / 5:47 am EDT (an hour earlier in EST, the first at
    # 11:07 pm the evening before -- still after arXiv's 8 pm ET announcement; Mon-Fri in UTC = Sun-Thu evenings ET).
    - cron: "7 4 * * 1-5"
    - cron: "37 5 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "47 9 * * 1-5"
  workflow_dispatch:           # "Run workflow" button for a manual run
  push:                        # republish when the pages are edited by hand
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Cache the INDUS text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-nasa-smd-ibm-st-v2

      - name: Install
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt

      - name: Build today's digest
        run: python code/daily.py --site docs

      - name: Save the digest and the day's archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/daily
          git diff --cached --quiet && exit 0
          git commit -m "Digest $(date -u +%F)"
          for attempt in 1 2 3; do
            if git pull --rebase; then
              git push && exit 0
            else
              # another run (or a manual build) published the same day while this one was building: keep theirs
              echo "Same day already published elsewhere; keeping the published version."
              git rebase --abort || true
              git reset --hard origin/main
              exit 0
            fi
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
